<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="only light">
<title>preview</title>
<style>
  body{font:14px/1.5 -apple-system,sans-serif;background:#888;margin:0;padding:16px;color:#111}
  .row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}
  .box{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  .box h3{margin:0;padding:6px 10px;font-size:12px;background:#111;color:#fff}
  iframe{border:0;display:block;background:#fff}
  #out{background:#fff;padding:10px;border-radius:8px;white-space:pre-wrap;font-family:monospace;font-size:12px;margin-bottom:16px}
</style>
</head>
<body>
<div id="out">loading…</div>
<div class="row">
  <div class="box"><h3>index.html @677px (fold)</h3><iframe id="i1" src="index.html" width="677" height="980"></iframe></div>
  <div class="box"><h3>index.html @390px (phone)</h3><iframe id="i2" src="index.html" width="390" height="980"></iframe></div>
</div>
<div class="row">
  <div class="box"><h3>portfolio-check.html @677px</h3><iframe id="i3" src="portfolio-check.html" width="677" height="980"></iframe></div>
</div>
<div class="row">
  <div class="box"><h3>us-stock-tax-guide.html @677px (dark page, must stay dark)</h3><iframe id="i4" src="us-stock-tax-guide.html" width="677" height="700"></iframe></div>
</div>
<script>
var out=document.getElementById('out');
function probe(id){
  var f=document.getElementById(id), d=f.contentDocument, w=f.contentWindow;
  if(!d) return id+': no document';
  var html=d.documentElement, body=d.body, cs=w.getComputedStyle(html);
  var brand=d.querySelector('.brand'), bar=d.querySelector('header.site .bar'), nav=d.querySelector('nav.top');
  var brandLines = brand ? Math.round(brand.getBoundingClientRect().height / (parseFloat(w.getComputedStyle(brand).fontSize)*1.65)) : null;
  var navLines = nav ? Math.round(nav.getBoundingClientRect().height / 34) : null;
  return [
    id+'  url='+f.getAttribute('src'),
    '  data-theme='+html.getAttribute('data-theme'),
    '  meta color-scheme='+(d.querySelector('meta[name=color-scheme]')||{}).content,
    '  computed color-scheme='+cs.colorScheme,
    '  body bg='+w.getComputedStyle(body).backgroundColor,
    '  body color='+w.getComputedStyle(body).color,
    '  card bg='+(d.querySelector('.card,.hubcard,.calcard')?w.getComputedStyle(d.querySelector('.card,.hubcard,.calcard')).backgroundColor:'-'),
    '  prefers-dark='+w.matchMedia('(prefers-color-scheme: dark)').matches,
    '  brand lines≈'+brandLines+'  brand box='+(brand?Math.round(brand.getBoundingClientRect().width)+'x'+Math.round(brand.getBoundingClientRect().height):'-'),
    '  header bar height='+(bar?Math.round(bar.getBoundingClientRect().height):'-'),
    '  nav height='+(nav?Math.round(nav.getBoundingClientRect().height):'-')+'  nav scrollW='+(nav?nav.scrollWidth+'/'+Math.round(nav.clientWidth):'-')
  ].join('\n');
}
function run(){
  var ids=['i1','i2','i3','i4'], res=[];
  for(var i=0;i<ids.length;i++){ try{ res.push(probe(ids[i])); }catch(e){ res.push(ids[i]+': '+e.message); } }
  out.textContent=res.join('\n\n');
}
window.addEventListener('load', function(){ setTimeout(run, 1200); });
</script>
</body>
</html>
